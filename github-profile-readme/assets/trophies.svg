<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anshita Singh GitHub trophies">
<defs>
  <clipPath id="rcT"><rect x="0" y="0" width="800" height="220" rx="16"/></clipPath>
  <linearGradient id="bggT" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2a0f4a"/>
  </linearGradient>
</defs>
<style>
  text { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .mono { font-family:'Consolas','SFMono-Regular','Menlo','Courier New',monospace; }
  .card-bg { animation: cardFadeIn 0.6s ease forwards; }
  @keyframes cardFadeIn { from{opacity:0;} to{opacity:1;} }
</style>
<style>
  .trophy-cell { opacity:0; animation: cellPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards; transform-box: fill-box; }
  @keyframes cellPop { 0%{opacity:0; transform:translateY(16px) scale(0.85);} 100%{opacity:1; transform:translateY(0) scale(1);} }
  .shine-sweep { animation: shineMove 3s ease-in-out infinite; }
  @keyframes shineMove { 0%{transform:translateX(0) skewX(-18deg);} 50%{transform:translateX(260px) skewX(-18deg);} 100%{transform:translateX(260px) skewX(-18deg);} }
  .rank-glow { animation: glowPulse 2.2s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
</style>
<g clip-path="url(#rcT)">
  <rect width="800" height="220" fill="url(#bggT)"/>
  <text x="24" y="26" font-size="15" font-weight="700" fill="#f5e6ff">Trophy Case</text>
  
    <g class="trophy-cell" style="animation-delay:0.30s" transform="translate(20,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#ff8fd6" stroke-opacity="0.5"/>
      <g clip-path="url(#tc0)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.20s"/>
      </g>
      <clipPath id="tc0"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">STARS</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">38</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#ff8fd6" stroke-width="3" class="rank-glow" style="animation-delay:0.60s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#ff8fd6">S</text>
      </g>
    </g>
    <g class="trophy-cell" style="animation-delay:0.45s" transform="translate(150,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#c084fc" stroke-opacity="0.5"/>
      <g clip-path="url(#tc1)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.35s"/>
      </g>
      <clipPath id="tc1"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">COMMITS</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">612</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#c084fc" stroke-width="3" class="rank-glow" style="animation-delay:0.75s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">A+</text>
      </g>
    </g>
    <g class="trophy-cell" style="animation-delay:0.60s" transform="translate(280,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#8be9fd" stroke-opacity="0.5"/>
      <g clip-path="url(#tc2)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.50s"/>
      </g>
      <clipPath id="tc2"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">REPOSITORIES</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">19</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#8be9fd" stroke-width="3" class="rank-glow" style="animation-delay:0.90s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#8be9fd">A</text>
      </g>
    </g>
    <g class="trophy-cell" style="animation-delay:0.75s" transform="translate(410,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#9be9a8" stroke-opacity="0.5"/>
      <g clip-path="url(#tc3)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.65s"/>
      </g>
      <clipPath id="tc3"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">FOLLOWERS</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">24</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#9be9a8" stroke-width="3" class="rank-glow" style="animation-delay:1.05s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#9be9a8">B+</text>
      </g>
    </g>
    <g class="trophy-cell" style="animation-delay:0.90s" transform="translate(540,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#8be9fd" stroke-opacity="0.5"/>
      <g clip-path="url(#tc4)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.80s"/>
      </g>
      <clipPath id="tc4"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">PRS</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">27</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#8be9fd" stroke-width="3" class="rank-glow" style="animation-delay:1.20s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#8be9fd">A</text>
      </g>
    </g>
    <g class="trophy-cell" style="animation-delay:1.05s" transform="translate(670,40)">
      <rect width="118" height="150" rx="14" fill="#170a28" fill-opacity="0.7" stroke="#ff8fd6" stroke-opacity="0.5"/>
      <g clip-path="url(#tc5)">
        <rect class="shine-sweep" x="-140" y="0" width="70" height="150" fill="#ffffff" fill-opacity="0.12" transform="skewX(-18)" style="animation-delay:1.95s"/>
      </g>
      <clipPath id="tc5"><rect width="118" height="150" rx="14"/></clipPath>
      <text x="59.0" y="34" text-anchor="middle" font-size="11.5" fill="#b79ad6" class="mono">EXPERIENCE</text>
      <text x="59.0" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="#f5e6ff">1y+</text>
      <g transform="translate(59.0,108)">
        <circle r="20" fill="none" stroke="#ff8fd6" stroke-width="3" class="rank-glow" style="animation-delay:1.35s"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#ff8fd6">S</text>
      </g>
    </g>
  <rect x="0" y="0" width="800" height="220" rx="16" fill="none" stroke="#ff9dd8" stroke-opacity="0.35"/>
</g>
</svg>