<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anshita Singh most used languages">
<defs>
  <clipPath id="rc"><rect x="0" y="0" width="495" height="195" rx="16"/></clipPath>
  <linearGradient id="bgg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2a0f4a"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff8fd6"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  
</defs>
<style>
  text { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .mono { font-family:'Consolas','SFMono-Regular','Menlo','Courier New',monospace; }
  .card-bg { animation: cardFadeIn 0.6s ease forwards; }
  @keyframes cardFadeIn { from{opacity:0;} to{opacity:1;} }
</style>
<style>
  .lang-bar { width:0; animation: growW 1.2s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes growW { from { width:0; } to { width: var(--w); } }
  .donut-seg { opacity:0; animation: donutIn 0.6s ease forwards; transform-origin:420px 97px; }
  @keyframes donutIn { from{opacity:0; transform:scale(0.7) rotate(-90deg);} to{opacity:1; transform:scale(1) rotate(-90deg);} }
</style>
<g clip-path="url(#rc)">
  <rect width="495" height="195" fill="url(#bgg)"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#f5e6ff">Most Used Languages</text>
  
        <text x="24" y="48" font-size="12.5" fill="#f5e6ff">Python</text>
        <text x="324" y="48" text-anchor="end" font-size="12" fill="#b79ad6" class="mono">52%</text>
        <rect x="24" y="54" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect class="lang-bar" x="24" y="54" width="156" height="8" rx="4" fill="#3572A5" style="animation-delay:0.40s; --w:156px;"/>
        <text x="24" y="74" font-size="12.5" fill="#f5e6ff">C++</text>
        <text x="324" y="74" text-anchor="end" font-size="12" fill="#b79ad6" class="mono">20%</text>
        <rect x="24" y="80" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect class="lang-bar" x="24" y="80" width="60" height="8" rx="4" fill="#f34b7d" style="animation-delay:0.55s; --w:60px;"/>
        <text x="24" y="100" font-size="12.5" fill="#f5e6ff">Dart</text>
        <text x="324" y="100" text-anchor="end" font-size="12" fill="#b79ad6" class="mono">14%</text>
        <rect x="24" y="106" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect class="lang-bar" x="24" y="106" width="42" height="8" rx="4" fill="#00B4AB" style="animation-delay:0.70s; --w:42px;"/>
        <text x="24" y="126" font-size="12.5" fill="#f5e6ff">Jupyter Notebook</text>
        <text x="324" y="126" text-anchor="end" font-size="12" fill="#b79ad6" class="mono">9%</text>
        <rect x="24" y="132" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect class="lang-bar" x="24" y="132" width="27" height="8" rx="4" fill="#DA5B0B" style="animation-delay:0.85s; --w:27px;"/>
        <text x="24" y="152" font-size="12.5" fill="#f5e6ff">Other</text>
        <text x="324" y="152" text-anchor="end" font-size="12" fill="#b79ad6" class="mono">5%</text>
        <rect x="24" y="158" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect class="lang-bar" x="24" y="158" width="15" height="8" rx="4" fill="#c084fc" style="animation-delay:1.00s; --w:15px;"/>
  <g><circle r="46" cx="420" cy="97" fill="none" stroke="#3572A5" stroke-width="18"
          stroke-dasharray="150.29 138.73" stroke-dashoffset="0.00"
          transform="rotate(-90 420 97)" class="donut-seg" style="animation-delay:0.30s"/><circle r="46" cx="420" cy="97" fill="none" stroke="#f34b7d" stroke-width="18"
          stroke-dasharray="57.81 231.22" stroke-dashoffset="-150.29"
          transform="rotate(-90 420 97)" class="donut-seg" style="animation-delay:0.42s"/><circle r="46" cx="420" cy="97" fill="none" stroke="#00B4AB" stroke-width="18"
          stroke-dasharray="40.46 248.56" stroke-dashoffset="-208.10"
          transform="rotate(-90 420 97)" class="donut-seg" style="animation-delay:0.54s"/><circle r="46" cx="420" cy="97" fill="none" stroke="#DA5B0B" stroke-width="18"
          stroke-dasharray="26.01 263.01" stroke-dashoffset="-248.56"
          transform="rotate(-90 420 97)" class="donut-seg" style="animation-delay:0.66s"/><circle r="46" cx="420" cy="97" fill="none" stroke="#c084fc" stroke-width="18"
          stroke-dasharray="14.45 274.58" stroke-dashoffset="-274.58"
          transform="rotate(-90 420 97)" class="donut-seg" style="animation-delay:0.78s"/></g>
  <rect x="0" y="0" width="495" height="195" rx="16" fill="none" stroke="#ff9dd8" stroke-opacity="0.35"/>
</g>
</svg>