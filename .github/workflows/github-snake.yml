name: Generate Snake Animation

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AnshitaSingh01
          outputs: |
            dist/github-snake.svg?color_snake=#c084fc&color_dots=#3a1258,#5b1f7a,#c084fc,#ff8fd6,#ffd6f2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8fd6
            dist/github-snake.gif?color_snake=#c084fc&color_dots=#3a1258,#5b1f7a,#c084fc,#ff8fd6,#ffd6f2

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
